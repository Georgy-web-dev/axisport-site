<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Axis Port">
  <g fill="none" stroke-linecap="round">
    <!-- axle -->
    <line x1="32" y1="3" x2="32" y2="61" stroke="#a78bfa" stroke-width="3" transform="rotate(-32 32 32)"/>
    <!-- outer gimbal -->
    <circle cx="32" cy="32" r="26" stroke="#6d28d9" stroke-width="4.5"/>
    <!-- inner gimbals -->
    <ellipse cx="32" cy="32" rx="10" ry="26" stroke="#7c3aed" stroke-width="3.5" transform="rotate(-32 32 32)"/>
    <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#8b5cf6" stroke-width="3.5" transform="rotate(-32 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5.5" fill="#6d28d9"/>
</svg>
